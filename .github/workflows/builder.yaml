name: Build

on:
  push:
    branches: [main]
    paths: ["firefly-iii/**"]
  pull_request:
    paths: ["firefly-iii/**"]
  workflow_dispatch:

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: addon-firefly-iii

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read add-on version
        id: meta
        run: |
          version=$(grep '^version:' firefly-iii/config.yaml | tr -d '"' | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: firefly-iii
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: ${{ needs.init.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          skip-existing: ${{ needs.init.outputs.version }}
          version: ${{ needs.init.outputs.version }}
