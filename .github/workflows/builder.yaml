name: Build

on:
  push:
    branches: [main]
    paths: ["*/**", "!.github/**", ".github/workflows/builder.yaml", ".github/scripts/smoke-test.sh"]
  pull_request:
    paths: ["*/**", "!.github/**", ".github/workflows/builder.yaml", ".github/scripts/smoke-test.sh"]
  workflow_dispatch:

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      # One build per add-on and architecture. Every add-on must set `image:`
      # in its config.yaml so that Home Assistant pulls it instead of building
      # it on the device; the image name is taken from there.
      - name: Prepare build matrix
        id: matrix
        run: |
          include='[]'
          for config in */config.yaml; do
            dir=$(dirname "$config")
            version=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' "$config")
            image=$(sed -n 's/^image: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' "$config")
            archs=$(awk '/^arch:/ {in_arch=1; next} in_arch && /^ *- / {print $2; next} {in_arch=0}' "$config")
            if [ -z "$version" ] || [ -z "$archs" ]; then
              echo "::error file=$config::Missing version or arch"
              exit 1
            fi
            if [ -z "$image" ]; then
              echo "::error file=$config::Missing image: add-ons must be published as prebuilt images"
              exit 1
            fi
            case "$image" in
              ghcr.io/${{ github.repository_owner }}/\{arch\}-*) ;;
              *)
                echo "::error file=$config::image must look like ghcr.io/${{ github.repository_owner }}/{arch}-<name>"
                exit 1
                ;;
            esac
            for arch in $archs; do
              case "$arch" in
                amd64) os=ubuntu-24.04 ;;
                aarch64) os=ubuntu-24.04-arm ;;
                *)
                  echo "::error file=$config::Unsupported architecture $arch"
                  exit 1
                  ;;
              esac
              include=$(jq -c \
                --arg addon "$dir" --arg version "$version" --arg arch "$arch" \
                --arg os "$os" --arg image "${image//\{arch\}/$arch}" \
                '. + [{addon: $addon, version: $version, arch: $arch, os: $os, image: $image}]' \
                <<< "$include")
            done
          done
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"

  # Start every image the way the Supervisor would (options.json in /data, the
  # AppArmor profile applied, the hassio network) and fail unless the web port
  # answers. Publishing waits for this.
  smoke-test:
    needs: init
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: sudo apt-get install -y --no-install-recommends apparmor python3-yaml

      - name: Build image
        run: docker build --tag addon-under-test "${{ matrix.addon }}"

      - name: Start the add-on
        run: .github/scripts/smoke-test.sh "${{ matrix.addon }}" addon-under-test

  build:
    needs: [init, smoke-test]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: ${{ matrix.addon }}
          cache-gha-scope: ${{ matrix.addon }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: ${{ matrix.version }}
          push: ${{ github.event_name != 'pull_request' }}
          skip-existing: ${{ matrix.version }}
          version: ${{ matrix.version }}
