name: Lint

on:
  push:
  pull_request:

jobs:
  addon-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        addon: [firefly-iii]
    steps:
      - uses: actions/checkout@v4
      - name: Run add-on linter
        uses: frenck/action-addon-linter@v2
        with:
          path: "./${{ matrix.addon }}"
