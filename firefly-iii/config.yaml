name: Firefly III
version: "0.1.2"
slug: firefly_iii
image: ghcr.io/fouzes/{arch}-addon-firefly-iii
description: Self-hosted personal finance manager
url: https://www.firefly-iii.org/
arch:
  - amd64
  - aarch64
init: false
startup: services
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Firefly III web interface
map:
  - addon_config:rw
options:
  site_owner: admin@example.com
  timezone: UTC
  default_language: en_US
  trusted_proxies: ""
  log_level: notice
  database:
    type: sqlite
    host: core-mariadb
    port: 3306
    name: firefly
    username: firefly
    password: ""
schema:
  site_owner: email
  timezone: str
  default_language: str
  trusted_proxies: str?
  app_key: password?
  log_level: list(debug|info|notice|warning|error|critical)
  database:
    type: list(sqlite|mysql)
    host: str
    port: port
    name: str
    username: str
    password: password?
