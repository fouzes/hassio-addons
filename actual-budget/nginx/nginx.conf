# Front door for Home Assistant ingress. Actual Budget itself keeps listening on
# 5006 for direct access; this proxies the ingress port to it and writes the
# ingress path into the page, which the patched web client resolves all of its
# addresses against (see patches/patch-web.mjs).
daemon off;
pid /run/addon-nginx.pid;
error_log /dev/stderr error;

events {
    worker_connections 256;
}

http {
    access_log off;
    default_type application/octet-stream;

    # Keep every temporary file under /tmp; /var/lib/nginx is not writable for
    # the worker user and the paths are not used for anything else.
    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    # Only an ingress path is ever written into the page.
    map $http_x_ingress_path $ingress_base {
        ~^/api/hassio_ingress/[A-Za-z0-9_-]+$ $http_x_ingress_path;
        default "";
    }

    server {
        listen 8099 default_server;

        # Only the Supervisor's ingress proxy (and this container, for the
        # health check) may connect.
        allow 172.30.32.2;
        allow 127.0.0.1;
        deny all;

        # Budget files are uploaded in one request; Actual applies its own
        # limits.
        client_max_body_size 0;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;

        # The page must reach the rewrite below uncompressed.
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The ingress path has already been stripped from the request, so
        # redirects such as /static -> /static/ have to get it back.
        absolute_redirect off;
        # (A named capture: the regex in the map above would clear $1.)
        proxy_redirect ~^/(?<path>.*)$ $ingress_base/$path;

        # The only thing that differs per request: the patched client reads
        # its base from this tag.
        sub_filter_once on;
        sub_filter '<base href="/">' '<base href="$ingress_base/">';

        location / {
            # Written by run.sh: set $actual_upstream http(s)://127.0.0.1:5006;
            include /run/addon-upstream.conf;
            proxy_ssl_verify off;
            proxy_pass $actual_upstream;
        }
    }
}
